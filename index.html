<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Congratulations, baby!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=La+Belle+Aurore&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg id="park" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a86"/><stop offset=".4" stop-color="#eba17f"/><stop offset=".7" stop-color="#f6c88a"/><stop offset="1" stop-color="#fbe3a8"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff6d6"/><stop offset=".25" stop-color="#ffd98a"/><stop offset=".6" stop-color="#ffb06a" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a60" stop-opacity="0"/></radialGradient>
  <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c9a77a"/><rect width="8" height="8" fill="#a8452f"/><rect x="8" y="8" width="8" height="8" fill="#a8452f"/></pattern>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a2c"/><stop offset="1" stop-color="#2a2316"/></linearGradient>
 </defs>
 <rect width="1600" height="900" fill="url(#sky)"/>
 <ellipse cx="1050" cy="560" rx="150" ry="22" fill="#f8b88a" opacity=".5"/>
 <ellipse cx="400" cy="470" rx="260" ry="16" fill="#f0a083" opacity=".35"/>
 <circle class="glow" cx="1050" cy="590" r="420" fill="url(#sun)"/>
 <circle cx="1050" cy="590" r="58" fill="#fff3cf"/>
 <g id="birds"></g>
 <path d="M0 610 Q200 560 420 600 T820 590 T1250 585 T1600 600 V900H0Z" fill="#c68478" opacity=".8"/>
 <path d="M0 650 Q260 590 560 640 T1100 630 T1600 640 V900H0Z" fill="#9a5f62"/>
 <g fill="#7a4a52" opacity=".9"><circle cx="300" cy="610" r="34"/><circle cx="345" cy="600" r="42"/><circle cx="1330" cy="615" r="38"/><circle cx="1380" cy="606" r="30"/><rect x="560" y="590" width="6" height="40"/><circle cx="563" cy="585" r="22"/></g>
 <path d="M0 700 Q400 660 800 690 T1600 680 V900H0Z" fill="#4a3236"/>
 <g id="walkers"></g>
 <g class="sway" fill="#2b1a24"><rect x="150" y="260" width="26" height="480"/><path d="M160 560 L90 480 M165 520 L260 440 M162 450 L100 380" stroke="#2b1a24" stroke-width="12" fill="none"/>
  <g class="canopy"><circle cx="160" cy="260" r="120"/><circle cx="70" cy="320" r="85"/><circle cx="270" cy="310" r="95"/><circle cx="170" cy="170" r="80"/></g></g>
 <g class="sway b" fill="#2b1a24"><rect x="1380" y="330" width="22" height="420"/>
  <g class="canopy"><circle cx="1390" cy="320" r="105"/><circle cx="1300" cy="380" r="78"/><circle cx="1490" cy="370" r="88"/><circle cx="1400" cy="230" r="70"/></g></g>
 <g class="sway" fill="#33202a" opacity=".95"><rect x="760" y="520" width="12" height="200"/><g class="canopy"><circle cx="766" cy="500" r="60"/><circle cx="715" cy="540" r="42"/><circle cx="820" cy="535" r="46"/></g></g>
 <rect y="720" width="1600" height="180" fill="url(#gr)"/>
 <g fill="#24161c"><!-- bench -->
  <rect x="470" y="738" width="300" height="12" rx="3"/><rect x="470" y="756" width="300" height="12" rx="3"/>
  <rect x="478" y="690" width="284" height="10" rx="3"/><rect x="478" y="710" width="284" height="10" rx="3"/>
  <rect x="490" y="690" width="10" height="110"/><rect x="740" y="690" width="10" height="110"/><rect x="496" y="770" width="8" height="50"/><rect x="736" y="770" width="8" height="50"/></g>
 <g id="picnic"><ellipse cx="1010" cy="818" rx="150" ry="14" fill="#1a1016" opacity=".35"/>
  <polygon points="925,788 1095,788 1130,818 890,818" fill="url(#chk)"/><polygon points="925,788 1095,788 1130,818 890,818" fill="#2b1a24" opacity=".3"/>
  <g fill="#24161c"><g transform="translate(960,802)"><circle cx="0" cy="-46" r="8"/><path d="M-9 0L-7-38h14l2 38z"/><rect x="4" y="-9" width="34" height="10" rx="5"/></g>
  <g transform="translate(1062,802) scale(-1,1)"><g class="talk"><circle cx="0" cy="-46" r="8"/></g><path d="M-9 0L-7-38h14l2 38z"/><rect x="4" y="-9" width="34" height="10" rx="5"/></g></g>
  <rect x="996" y="780" width="28" height="14" rx="3" fill="#6b4a2e"/><path d="M998 780Q1010 764 1022 780" stroke="#6b4a2e" stroke-width="2.5" fill="none"/><circle cx="1036" cy="792" r="4" fill="#b5533c"/></g>
 <g id="grass" fill="none" stroke="#1d150f" stroke-linecap="round"></g>
</svg>
<div id="dusk"></div><div id="fx"></div><div id="beam"></div>

<div id="pw" role="button" tabindex="0" aria-label="Open the paper airplane">
 <div id="tilt"><div id="bob">
  <svg id="paper" viewBox="0 0 400 520" aria-hidden="true">
   <g stroke="rgba(110,84,52,.55)" stroke-width="1" stroke-linejoin="round"><polygon id="f0"/><polygon id="f1"/><polygon id="f2"/><polygon id="f3"/></g>
   <g id="creases" stroke="rgba(120,92,58,.35)" stroke-width="1.2"><line x1="200" y1="40" x2="200" y2="480"/><line x1="40" y1="260" x2="360" y2="260"/><line x1="40" y1="150" x2="360" y2="150" stroke-dasharray="2 5"/><line x1="40" y1="370" x2="360" y2="370" stroke-dasharray="2 5"/></g>
  </svg>
  <article id="letter" aria-label="Your letter"></article>
 </div></div>
</div>
<p id="hint">Tap the paper plane</p>

<div id="pl" aria-label="Music player">
 <div class="dev" id="dev">
  <div class="lcd">
   <div class="t" id="ttl"></div><div class="a" id="art"></div>
   <div class="row"><span id="stat">STOPPED</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
   <div class="row"><span id="cur">0:00</span><span id="dur">-:--</span></div>
   <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Playback position" disabled>
  </div>
  <div class="wheel"><div class="ticks"></div><button id="play" aria-label="Play" disabled>&#9654;</button></div>
  <label class="vol">vol <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></label>
  <div class="brand">GOLDEN-HOUR 2</div>
 </div>
</div>
<button id="again">Read the letter again</button>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<script src="script/content.js"></script>
<script src="script/main.js"></script>
</body>
</html>
